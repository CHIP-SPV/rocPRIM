name: Presubmit (chipStar / Intel)

on:
  pull_request:
    paths-ignore: "docs/**"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-llvm-22-native-release:
    runs-on: [self-hosted, Linux, X64]
    env:
      CHIP_MODULE_CACHE_DIR: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build and test
        shell: bash
        run: |
          set -e
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local
            source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then
            source /etc/profile.d/lmod.sh
          else
            source /etc/profile.d/modules.sh
          fi
          module use /space/pvelesko/modulefiles
          module load oneapi/2025.0.4
          module load llvm/22.0-native
          module load HIP/chipStar/main
          module load level-zero/dgpu
          module list
          rm -rf ~/.cache/chipStar build
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$(which hipcc)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON \
            -DBUILD_BENCHMARK=OFF \
            -DAMDGPU_TEST_TARGETS=""
          cmake --build build -j 8
          exclude=$(grep -Ev '^\s*(#|$)' .ci/exclude.txt | paste -sd '|' -)
          cd build
          if [ -n "$exclude" ]; then
            ctest --output-on-failure --timeout 300 -L chip-spv-gpu -E "$exclude"
          else
            ctest --output-on-failure --timeout 300 -L chip-spv-gpu
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ctest-logs-llvm-22-native-release
          path: build/Testing/**/LastTest*.log
          if-no-files-found: ignore
