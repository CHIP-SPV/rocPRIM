name: Presubmit

on:
  pull_request:
    paths-ignore: "docs/**"
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  meatloaf-x64-intel:
    runs-on: [self-hosted, Linux, X64]
    env:
      CHIP_MODULE_CACHE_DIR: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build and test (chip-spv-gpu)
        shell: bash
        run: |
          set -e
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local
            source "$MODULESHOME/init/bash"
          elif [ -f /etc/profile.d/lmod.sh ]; then
            source /etc/profile.d/lmod.sh
          else
            source /etc/profile.d/modules.sh
          fi
          module use /space/pvelesko/modulefiles
          module load oneapi/2025.0.4 llvm/22.0-native HIP/chipStar/main level-zero/dgpu
          module list
          # This install names a deleted CI staging dir; use copies of its config that name the install.
          stale=$(sed -n 's/^HIP_PATH=//p' "$HIP_PATH/share/.hipInfo")
          hip="$RUNNER_TEMP/chipstar-main"
          rm -rf "$hip" && mkdir -p "$hip/bin" "$hip/share" "$hip/lib/cmake"
          cp "$HIP_PATH/bin/hipcc" "$hip/bin/" && cp "$HIP_PATH/share/.hipInfo" "$hip/share/" && cp -r "$HIP_PATH/lib/cmake/hip" "$hip/lib/cmake/"
          sed -i "s|$stale|$HIP_PATH|g" "$hip/share/.hipInfo" "$hip"/lib/cmake/hip/*.cmake
          rm -rf ~/.cache/chipStar build
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$hip/bin/hipcc" -Dhip_DIR="$hip/lib/cmake/hip" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON -DBUILD_BENCHMARK=OFF \
            -DAMDGPU_TEST_TARGETS="" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j 8
          exclude=$(grep -Ev '^\s*(#|$)' .ci/exclude.txt | paste -sd '|' -)
          cd build
          ctest --output-on-failure --timeout 300 -L chip-spv-gpu ${exclude:+-E "$exclude"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ctest-logs-meatloaf
          path: build/Testing/**/LastTest*.log
          if-no-files-found: ignore

  salami-arm64:
    runs-on: [self-hosted, Linux, ARM64]
    env:
      CHIP_MODULE_CACHE_DIR: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build and test (chip-spv-cpu)
        shell: bash
        run: |
          set -e
          if [ -f "$HOME/.local/init/bash" ]; then
            export MODULESHOME=$HOME/.local
            source "$MODULESHOME/init/bash"
          else
            source /etc/profile.d/modules.sh
          fi
          module use ~/modulefiles
          module load llvm/22.0-native HIP/chipStar/main
          module list
          rm -rf ~/.cache/chipStar build
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$(which hipcc)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON -DBUILD_BENCHMARK=OFF \
            -DAMDGPU_TEST_TARGETS="" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j 2
          exclude=$(grep -Ev '^\s*(#|$)' .ci/exclude.txt | paste -sd '|' -)
          cd build
          ctest --output-on-failure --timeout 300 -L chip-spv-cpu ${exclude:+-E "$exclude"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ctest-logs-salami
          path: build/Testing/**/LastTest*.log
          if-no-files-found: ignore

  pastrami-macos:
    runs-on: [self-hosted, ARM64, MacOS]
    env:
      CHIP_MODULE_CACHE_DIR: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Build and test (chip-spv-cpu)
        shell: bash
        run: |
          set -e
          export PATH="/opt/homebrew/bin:$PATH"
          # Without an explicit deployment target, clang's HIP driver asserts in Darwin::AddDeploymentTarget.
          export MACOSX_DEPLOYMENT_TARGET=15.0
          source /opt/homebrew/Cellar/modules/5.6.0/init/bash
          module use ~/modulefiles
          module load llvm/22.0-native pocl HIP/chipStar/main
          # The install's .hipInfo points this override at a deleted source tree.
          export HIPCC_COMPILE_FLAGS_APPEND="-Xarch_device -I$(dirname "$(dirname "$(which hipcc)")")/include/hip/devicelib/macOS"
          module list
          rm -rf ~/.cache/chipStar build
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$(which hipcc)" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TEST=ON -DBUILD_BENCHMARK=OFF \
            -DAMDGPU_TEST_TARGETS="" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j 4
          exclude=$(grep -Ev '^\s*(#|$)' .ci/exclude.txt | paste -sd '|' -)
          cd build
          ctest --output-on-failure --timeout 300 -L chip-spv-cpu ${exclude:+-E "$exclude"}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ctest-logs-pastrami
          path: build/Testing/**/LastTest*.log
          if-no-files-found: ignore
